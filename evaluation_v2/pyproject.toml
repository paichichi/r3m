[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eval_v2"
version = "0.1.0"
description = "Brand new Gymnasium + MuJoCo evaluation suite (BC + online success rate)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "numpy>=1.23",
    "tqdm",
    "tabulate",
    "gymnasium>=1.0",
    "mujoco>=3.0",
    "torch>=2.1",
    "torchvision",
    "gymnasium-robotics>=1.0",
    "scipy",
    "wandb",
    "hydra-submitit-launcher",
    "submitit",
    "moviepy",
    'gdown==4.4.0',
    #'pillow==9.0.1',
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eval_v2*"]