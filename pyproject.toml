[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "r3m"
version = "0.0.0"
description = "R3M: Pretrained Reusable Representations for Robot Manipulation from Diverse Human Videos"
readme = "README.md"
requires-python = ">=3.0"
authors = [
  { name = "Suraj Nair (Meta AI)" }
]
dependencies = [
    "gdown==4.4.0",
    "pillow==9.0.1",
#    'torch<=1.10.2,>=1.7.1',
#    'torchvision<=0.11.3,>=0.8.2',
#    'omegaconf==2.1.1',
#    'hydra-core==1.1.1',
]

[tool.setuptools.packages.find]
where = ["."]